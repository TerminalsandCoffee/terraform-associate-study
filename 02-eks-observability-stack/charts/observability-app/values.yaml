# Global defaults
imagePullPolicy: IfNotPresent
mesh:
  enabled: false
  # Add optional annotations for a mesh injector (e.g., Istio, Linkerd)
  annotations: {}

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/example/observability-frontend
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    API_BASE_URL: "http://observability-api"
  podAnnotations: {}

api:
  replicaCount: 2
  image:
    repository: ghcr.io/example/observability-api
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    PORT: "8080"
    OTEL_SERVICE_NAME: "observability-api"
  podAnnotations: {}
